<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>School Portal</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Attendance, marks, timetables and notices for students, teachers and the school office." />
    <meta name="theme-color" content="#4f46e5" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <script>
      // Apply this device's last theme and palette (or the system theme) before first paint, so the page never flashes the wrong colours.
      try {
        var t = localStorage.getItem('theme'), a = localStorage.getItem('accent');
        if (a) document.documentElement.dataset.accent = a;
        document.documentElement.dataset.theme = t === 'light' || t === 'dark' ? t : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      } catch (e) {
        document.documentElement.dataset.theme = 'light';
      }
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
